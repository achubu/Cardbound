name: Transfer verified Claudebound snapshot
on:
  push:
    branches: [codex/claudebound-sync-20261023]
    paths: [.github/workflows/sync-claudebound.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce verified snapshot and transfer Git objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch https://github.com/achubu/claudebound.git 6dce16c12176b3ae6bc98a03dd7eecccae9fd70b
          source_dir="$RUNNER_TEMP/claudebound-source"
          mkdir -p "$source_dir"
          git archive FETCH_HEAD | tar -x -C "$source_dir"
          git read-tree --reset -u defe3cb55525407e8c9972c22cfcfd3bebdd0502
          SOURCE_DIR="$source_dir" python3 - <<'PY'
          import os,pathlib,subprocess,shutil,base64
          src=pathlib.Path(os.environ['SOURCE_DIR']); dst=pathlib.Path('.')
          protect={'CNAME','CLAUDE.md','assets/cards/art-refresh.md','tools/art-refresh/prompts.json'}
          for f in filter(None,subprocess.check_output(['git','ls-tree','-rz','--name-only','FETCH_HEAD']).decode().split('\0')):
              if f in protect or pathlib.Path(f).name=='.DS_Store' or f.startswith('unused assets/'):continue
              p=dst/f; p.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src/f,p)
          for p in (dst/'assets/cards').glob('level*/counter_*.png'):p.unlink()
          subprocess.run(['git','apply','--whitespace=nowarn','-'],input=base64.b64decode(''),check=True)
          PY
          git add -A
          actual=$(git write-tree)
          test "$actual" = "4eb5c91989b5acc4a1c786f2cf844c6118e2353d"
          git config user.name 'achubu'
          git config user.email 'achubu@users.noreply.github.com'
          git commit -m 'Import Claudebound Round 248 and retire Reversal cards'
          git push origin HEAD:codex/claudebound-sync-20261023
      - name: Install browser checks outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/cardbound-browser" playwright
          "$RUNNER_TEMP/cardbound-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser suites
        env:
          NODE_PATH: ${{ runner.temp }}/cardbound-browser/node_modules
        run: |
          node tests/battle-header.test.cjs
          node tests/mech-badge.test.cjs
          node tests/reward-escape.test.cjs
          node tests/tutorial.test.cjs
